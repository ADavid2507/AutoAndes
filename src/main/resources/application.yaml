spring:
  application:
    name: autoandes-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
        default_batch_fetch_size: 50
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  zone: America/Lima
  cors-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  jwt-secret: ${JWT_SECRET:${app.jwt.secret}}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
